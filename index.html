<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitmix Producciones | Reservas y Galería</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #ffc107; margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #aaa; margin-bottom: 15px; }
        input, textarea, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: none; font-size: 1rem; }
        input, textarea { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        textarea { resize: vertical; height: 90px; }
        button { background: #ffc107; color: #121212; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e0a800; }
        .success-msg { color: #28a745; margin-bottom: 15px; font-weight: bold; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .gallery-grid img, .gallery-grid video { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Presentación -->
        <div class="card">
            <h1>Leitmix Producciones</h1>
            <p>Música, sonido e iluminación profesional.</p>
        </div>

        <!-- Galería de Eventos -->
        <div class="card">
            <h2>📸 Galería de Eventos</h2>
            <div id="publicGallery" class="gallery-grid">Cargando galería...</div>
        </div>

        <!-- Hoja de Ruta / Reserva -->
        <div class="card">
            <h2>📋 Hoja de Ruta / Reserva</h2>
            <div id="reservaMsg" class="success-msg"></div>
            <form id="reservaForm">
                <input type="text" id="nombreCliente" placeholder="Tu Nombre y Apellido" required>
                <input type="date" id="fechaEvento" required>
                <input type="text" id="lugarEvento" placeholder="Lugar / Salón del Evento" required>
                <input type="text" id="horarioEvento" placeholder="Horario (Ej: 22:00 a 05:00 hs)" required>
                <textarea id="detallesEvento" placeholder="Detalles extra (Estilo musical, equipos)"></textarea>
                <button type="submit">Enviar Reserva por WhatsApp</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./supabase.js";

        const telefonoDj = "5491150480339"; 
        const publicGallery = document.getElementById("publicGallery");

        async function cargarGaleriaPublica() {
            try {
                publicGallery.innerHTML = "<p style='color: #aaa; grid-column: span 2;'>Cargando archivos...</p>";
                let todosLosArchivos = [];

                // 1. Listar las carpetas principales del bucket Media
                const { data: folders, error: folderError } = await supabase.storage
                    .from('Media')
                    .list('', { limit: 100 });

                if (folderError) {
                    publicGallery.innerHTML = `<p style='color: #ff6b6b; grid-column: span 2;'>Error: ${folderError.message}</p>`;
                    return;
                }

                // 2. Buscar archivos dentro de las carpetas (imagenes, videos, logo) o sueltos
                for (const item of folders) {
                    if (item.id === null) {
                        // Es una carpeta, entramos a buscar adentro
                        const { data: subFiles } = await supabase.storage
                            .from('Media')
                            .list(item.name, { limit: 50 });
                        
                        if (subFiles) {
                            subFiles.forEach(subFile => {
                                if (subFile.name !== '.emptyFolderPlaceholder') {
                                    todosLosArchivos.push({
                                        name: `${item.name}/${subFile.name}`,
                                        created_at: subFile.created_at
                                    });
                                }
                            });
                        }
                    } else if (item.name !== '.emptyFolderPlaceholder') {
                        // Es un archivo suelto en la raíz
                        todosLosArchivos.push(item);
                    }
                }

                if (todosLosArchivos.length === 0) {
                    publicGallery.innerHTML = "<p style='color: #aaa; grid-column: span 2;'>No hay archivos en la galería todavía.</p>";
                    return;
                }

                publicGallery.innerHTML = "";
                todosLosArchivos.forEach(file => {
                    const { data: publicUrlData } = supabase.storage
                        .from('Media')
                        .getPublicUrl(file.name);

                    const fileNameLower = file.name.toLowerCase();
                    const isVideo = fileNameLower.endsWith('.mp4') || fileNameLower.endsWith('.webm') || fileNameLower.endsWith('.mov');
                    
                    if (isVideo) {
                        const video = document.createElement("video");
                        video.src = publicUrlData.publicUrl;
                        video.controls = true;
                        publicGallery.appendChild(video);
                    } else if (fileNameLower.endsWith('.jpg') || fileNameLower.endsWith('.jpeg') || fileNameLower.endsWith('.png') || fileNameLower.endsWith('.webp')) {
                        const img = document.createElement("img");
                        img.src = publicUrlData.publicUrl;
                        img.alt = "Evento Leitmix";
                        publicGallery.appendChild(img);
                    }
                });
            } catch (err) {
                publicGallery.innerHTML = "<p style='color: #ff6b6b; grid-column: span 2;'>Error de conexión con la galería.</p>";
            }
        }

        const reservaForm = document.getElementById("reservaForm");
        const reservaMsg = document.getElementById("reservaMsg");

        reservaForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            reservaMsg.textContent = "";

            const cliente = document.getElementById("nombreCliente").value;
            const fecha = document.getElementById("fechaEvento").value;
            const lugar = document.getElementById("lugarEvento").value;
            const horario = document.getElementById("horarioEvento").value;
            const detalles = document.getElementById("detallesEvento").value;

            await supabase.from('reservas').insert([{ cliente, fecha, lugar, horario, detalles }]);

            const texto = `¡Hola! Quiero confirmar una reserva:%0A` +
                          `*Cliente:* ${encodeURIComponent(cliente)}%0A` +
                          `*Fecha:* ${encodeURIComponent(fecha)}%0A` +
                          `*Lugar:* ${encodeURIComponent(lugar)}%0A` +
                          `*Horario:* ${encodeURIComponent(horario)}%0A` +
                          `*Detalles:* ${encodeURIComponent(detalles)}`;

            reservaMsg.textContent = "¡Guardado! Redirigiendo a WhatsApp...";
            
            setTimeout(() => {
                window.location.href = `https://wa.me/${telefonoDj}?text=${texto}`;
            }, 1000);
        });

        cargarGaleriaPublica();
    </script>
</body>
</html>
