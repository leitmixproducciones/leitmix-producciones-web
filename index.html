<!-- Ejemplo de cómo debe verse en tu HTML dentro del panel de administración -->
<div class="admin-card">
    <h3>Gestión de Videos</h3>
    
    <!-- Formulario existente -->
    <form id="formAdminVideo">
        <input type="text" id="adminTituloVideo" placeholder="Título del video" required>
        <input type="text" id="adminUrlVideo" placeholder="URL del video (Supabase o YouTube)" required>
        <button type="submit">Guardar Video</button>
    </form>

    <!-- Botón nuevo para sincronizar desde Storage -->
    <button id="btnSincronizarVideos" style="background: #17a2b8; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%;">
        🔄 Sincronizar Videos de Storage
    </button>

    <div id="adminListaVideos" style="margin-top: 15px;"></div>
</div>
