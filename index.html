<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitmix Producciones | DJ & Eventos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h1, h2 { color: #ffc107; margin-bottom: 15px; }
        p { color: #aaa; margin-bottom: 20px; }
        input, textarea, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: none; font-size: 1rem; }
        input, textarea { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        textarea { resize: vertical; height: 100px; }
        button { background: #ffc107; color: #121212; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e0a800; }
        .success-msg { color: #28a745; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Leitmix Producciones</h1>
            <p>Música, sonido e iluminación profesional para tu evento.</p>
        </div>

        <div class="card">
            <h2>📅 Reservas de Fecha</h2>
            <div id="reservaMsg" class="success-msg"></div>
            <form id="reservaForm">
                <input type="text" id="nombreCliente" placeholder="Tu Nombre y Apellido" required>
                <input type="date" id="fechaEvento" required>
                <textarea id="detallesEvento" placeholder="Detalles del evento (Lugar, horario, tipo de fiesta)"></textarea>
                <button type="submit">Enviar Solicitud de Reserva</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./supabase.js";

        const reservaForm = document.getElementById("reservaForm");
        const reservaMsg = document.getElementById("reservaMsg");

        reservaForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            reservaMsg.textContent = "";

            const nombre = document.getElementById("nombreCliente").value;
            const fecha = document.getElementById("fechaEvento").value;
            const detalles = document.getElementById("detallesEvento").value;

            const { error } = await supabase
                .from('reservas')
                .insert([{ cliente: nombre, fecha: fecha, detalles: detalles }]);

            if (error) {
                alert("Hubo un error al enviar la reserva: " + error.message);
            } else {
                reservaMsg.textContent = "¡Reserva enviada con éxito! Nos pondremos en contacto.";
                reservaForm.reset();
            }
        });
    </script>
</body>
</html>
