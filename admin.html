<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | Leitmix Producciones</title>

<style>

body{
font-family:Arial,sans-serif;
background:#080808;
color:white;
padding:20px;
}

h1,h2{
color:#f5b400;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:none;
box-sizing:border-box;
}

button{
background:#f5b400;
font-weight:bold;
cursor:pointer;
}

.card{
background:#151515;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

.item{
background:#222;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.item img{
width:120px;
border-radius:10px;
}

.item video{
width:100%;
max-width:300px;
border-radius:10px;
}

.borrar{
background:#d40000;
color:white;
}

/* Estilos para textos de ayuda en el formulario */
.ayuda {
font-size: 12px;
color: #aaa;
margin-bottom: 8px;
display: block;
}

.btn-secundario {
background: #333;
color: #fff;
margin-top: 5px;
}

</style>

</head>


<body>


<div class="card">

<h1>Panel Leitmix Producciones</h1>

</div>


<!-- NUEVA SECCIÓN: CONFIGURACIÓN DEL NEGOCIO Y URL WEB -->
<div class="card">

<h2>⚙️ Configuración de tu Web</h2>

<label for="configUrlWeb"><b>🌐 Dirección de tu Página Web (URL):</b></label>
<input id="configUrlWeb" type="url" placeholder="https://tu-sitio-dj.com">
<span class="ayuda">Ejemplo: https://mi-pagina-dj.com (Se usa para enviar los recibos a tus clientes).</span>

<label for="configNombre"><b>🎧 Nombre de Fantasía / Marca:</b></label>
<input id="configNombre" type="text" placeholder="Ej: DJ Carlos Eventos">

<label for="configWhatsapp"><b>📱 Teléfono / WhatsApp:</b></label>
<input id="configWhatsapp" type="tel" placeholder="Ej: 5491112345678">

<button id="guardarConfiguracion">
Guardar Configuración
</button>

<button id="btnVerWeb" class="btn-secundario">
👁️ Visitar mi página web
</button>

</div>


<div class="card">

<h2>Agregar imagen a Galería</h2>

<input id="imagenArchivo" type="file" accept="image/*">

<input id="imagenTitulo" placeholder="Título de imagen">

<button id="guardarImagen">
Guardar imagen
</button>

</div>



<div class="card">

<h2>Agregar video</h2>

<input id="videoArchivo" type="file" accept="video/*">

<input id="videoTitulo" placeholder="Título del video">

<button id="guardarVideo">
Guardar video
</button>

</div>



<div class="card">

<h2>Imágenes subidas</h2>

<div id="listaImagenes">

</div>

</div>



<div class="card">

<h2>Videos subidos</h2>

<div id="listaVideos">

</div>

</div>


<!-- Script para guardar y cargar la URL y datos del DJ en Supabase -->
<script type="module">
    import { supabase } from './supabase.js';

    // Cargar la configuración guardada del usuario al iniciar
    async function cargarConfiguracion() {
        try {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const { data, error } = await supabase
                .from('configuracion')
                .select('*')
                .eq('user_id', user.id)
                .single();

            if (data) {
                if (data.url_web) document.getElementById('configUrlWeb').value = data.url_web;
                if (data.nombre_fantasia) document.getElementById('configNombre').value = data.nombre_fantasia;
                if (data.telefono_whatsapp) document.getElementById('configWhatsapp').value = data.telefono_whatsapp;
            }
        } catch (e) {
            console.log("Aún no hay configuración guardada o tabla no creada.");
        }
    }

    // Guardar la configuración en Supabase
    document.getElementById('guardarConfiguracion').addEventListener('click', async () => {
        const urlWeb = document.getElementById('configUrlWeb').value.trim();
        const nombre = document.getElementById('configNombre').value.trim();
        const whatsapp = document.getElementById('configWhatsapp').value.trim();

        if (!urlWeb) {
            alert('Por favor ingresá la URL de tu página web.');
            return;
        }

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            alert('Debes estar logueado para guardar la configuración.');
            return;
        }

        const { error } = await supabase
            .from('configuracion')
            .upsert({
                user_id: user.id,
                url_web: urlWeb,
                nombre_fantasia: nombre,
                telefono_whatsapp: whatsapp
            });

        if (error) {
            alert('Error al guardar: ' + error.message);
        } else {
            alert('¡Configuración guardada correctamente!');
        }
    });

    // Botón para visitar la web ingresada
    document.getElementById('btnVerWeb').addEventListener('click', () => {
        const url = document.getElementById('configUrlWeb').value.trim();
        if (url) {
            window.open(url, '_blank');
        } else {
            alert('Primero ingresá y guardá la URL de tu sitio web.');
        }
    });

    cargarConfiguracion();
</script>

<script type="module" src="admin.js"></script>


</body>
</html>
