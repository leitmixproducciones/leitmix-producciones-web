<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de DJ - Leitmix</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
    button { cursor: pointer; padding: 10px 14px; border-radius: 6px; border: none; background: #f5b400; font-weight: bold; color: #000; }
    .card { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #2a2a2a; margin-bottom: 15px; }
    h2, h3, h4 { color: #f5b400; margin-top: 0; }
    input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; }
    .grid-dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: #222; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #333; }
    .stat-val { font-size: 18px; font-weight: bold; color: #f5b400; }
    .item-card { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
    .btn-danger { background: #e74c3c; color: white; }
    .oculto { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin:0;">🎧 Panel Leitmix</h2>
    <button id="cerrarSesion" class="btn-danger">Salir</button>
  </div>

  <!-- RESUMEN -->
  <div class="card">
    <h3>📊 Resumen de Eventos</h3>
    <div class="grid-dash">
      <div class="stat-box">Reservas<div id="dashTotalReservas" class="stat-val">0</div></div>
      <div class="stat-box">Confirmadas<div id="dashConfirmadas" class="stat-val">0</div></div>
      <div class="stat-box">Pendientes<div id="dashPendientes" class="stat-val">0</div></div>
    </div>
  </div>

  <!-- CONFIGURACIÓN DEL NEGOCIO -->
  <div class="card">
    <h3>⚙️ Configuración del Negocio</h3>
    <input type="text" id="cfgNombre" placeholder="Nombre Fantasía / Marca">
    <input type="text" id="cfgWhatsapp" placeholder="Teléfono WhatsApp (Ej: 5491112345678)">
    <input type="text" id="cfgAlias" placeholder="Alias de Pago / CBU">
    <input type="text" id="cfgInstagram" placeholder="Instagram URL">
    <button id="btnGuardarConfig">Guardar Datos</button>
  </div>

  <!-- GALERÍA DE FOTOS -->
  <div class="card">
    <h3>🖼️ Subir Fotos a la Galería</h3>
    <input type="file" id="fotoArchivo" accept="image/*">
    <input type="text" id="fotoTitulo" placeholder="Título o descripción corta">
    <button id="btnSubirFoto">Subir Foto</button>
    <div id="listaFotos" style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;"></div>
  </div>

  <!-- LISTA DE RESERVAS -->
  <div class="card">
    <h3>📅 Solicitudes de Reservas</h3>
    <div id="listaReservas">Cargando reservas...</div>
  </div>

  <!-- EMITIR RECIBOS -->
  <div class="card">
    <h3>🧾 Emitir Recibo Manual</h3>
    <input type="text" id="recNombre" placeholder="Nombre del Cliente">
    <input type="text" id="recEvento" placeholder="Tipo de Evento (Ej: Casamiento, XV)">
    <input type="date" id="recFecha">
    <input type="number" id="recTotal" placeholder="Monto Total ($)">
    <input type="number" id="recImporte" placeholder="Monto Recibido / Seña ($)">
    <input type="text" id="recConcepto" placeholder="Concepto (Ej: Seña por servicio DJ)">
    <button id="btnCrearRecibo">Generar Recibo</button>
  </div>

  <!-- HISTORIAL DE RECIBOS -->
  <div class="card">
    <h3>📄 Historial de Recibos</h3>
    <div id="listaRecibos">Cargando recibos...</div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
