<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | Leitmix Producciones</title>

<style>

body{
font-family:Arial,sans-serif;
background:#080808;
color:white;
padding:20px;
}

h1,h2,h3{
color:#f5b400;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:none;
box-sizing:border-box;
}

button{
background:#f5b400;
font-weight:bold;
cursor:pointer;
}

.card{
background:#151515;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

.item{
background:#222;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.item img{
width:120px;
border-radius:10px;
}

.item video{
width:100%;
max-width:300px;
border-radius:10px;
}

.borrar{
background:#d40000;
color:white;
}

.ayuda {
font-size: 12px;
color: #aaa;
margin-bottom: 8px;
display: block;
}

</style>

</head>


<body>


<div class="card">

<h1>Panel Leitmix Producciones</h1>

</div>


<!-- SECCIÓN: CONFIGURACIÓN DEL NEGOCIO COMPLETA -->
<div class="card">

<h2>⚙️ Configuración del negocio</h2>

<label for="configUrlWeb"><b>🌐 Dirección de tu Página Web (URL):</b></label>
<input id="configUrlWeb" type="url" placeholder="https://tu-sitio-dj.com">
<span class="ayuda">Link completo de tu web. Se usará para redireccionar y para tus recibos.</span>

<label for="configNombre"><b>Nombre del DJ / Productora:</b></label>
<input id="configNombre" type="text" placeholder="Leitmix Producciones">

<label for="configSubtitulo"><b>Eslogan o Subtítulo:</b></label>
<input id="configSubtitulo" type="text" placeholder="Sonido profesional • Iluminación • Efectos">

<label for="configWhatsapp"><b>WhatsApp para reservas (con código de país sin +):</b></label>
<input id="configWhatsapp" type="tel" placeholder="11 5048-0339">

<label for="configAlias"><b>Alias de Pago (MercadoPago / CBU):</b></label>
<input id="configAlias" type="text" placeholder="Leitmix.nx">

<h3 style="margin-top: 20px;">🔗 Redes Sociales</h3>

<label for="configInstagram"><b>Link de Instagram:</b></label>
<input id="configInstagram" type="url" placeholder="https://www.instagram.com/tu_usuario">

<label for="configTiktok"><b>Link de TikTok:</b></label>
<input id="configTiktok" type="url" placeholder="https://www.tiktok.com/@tu_usuario">

<label for="configYoutube"><b>Link de YouTube:</b></label>
<input id="configYoutube" type="url" placeholder="https://www.youtube.com/@tu_canal">

<button id="guardarConfiguracion" style="margin-top: 15px;">
💾 Guardar Configuración
</button>

</div>


<div class="card">

<h2>Agregar imagen a Galería</h2>

<input id="imagenArchivo" type="file" accept="image/*">

<input id="imagenTitulo" placeholder="Título de imagen">

<button id="guardarImagen">
Guardar imagen
</button>

</div>



<div class="card">

<h2>Agregar video</h2>

<input id="videoArchivo" type="file" accept="video/*">

<input id="videoTitulo" placeholder="Título del video">

<button id="guardarVideo">
Guardar video
</button>

</div>



<div class="card">

<h2>Imágenes subidas</h2>

<div id="listaImagenes">

</div>

</div>



<div class="card">

<h2>Videos subidos</h2>

<div id="listaVideos">

</div>

</div>


<script type="module" src="admin.js"></script>


</body>
</html>
