<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Profesional | Leitmix Producciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.6); border: 1px solid #333; }
        h1, h2 { color: #ffc107; margin-bottom: 15px; font-size: 1.4rem; text-align: center; }
        input, select, button { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; border: none; font-size: 1rem; }
        input, select { background: #2a2a2a; color: #fff; border: 1px solid #555; }
        button, .btn-main { background: #ffc107; color: #121212; font-weight: bold; cursor: pointer; }
        button:active { background: #d48806; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-link { background: transparent; color: #ffc107; border: none; font-size: 0.9rem; padding: 6px; margin-top: -4px; margin-bottom: 10px; cursor: pointer; text-decoration: underline; text-align: center; display: block; width: 100%; }
        .hidden { display: none !important; }
        .error-msg { color: #ff6b6b; text-align: center; margin-bottom: 10px; font-size: 0.9rem; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .stat-box { background: #2a2a2a; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #444; }
        .stat-box h3 { font-size: 1.4rem; color: #ffc107; margin-top: 5px; }
        .scroll-section { max-height: 280px; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 10px; }
        hr { border: 0; height: 1px; background: #333; margin: 25px 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. SECCIÓN DE LOGIN -->
        <div id="loginSection" class="card">
            <h2>🔐 Acceso Profesional</h2>
            <div id="loginError" class="error-msg"></div>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
                <button type="submit">Ingresar al Panel</button>
            </form>
            <button type="button" class="btn-link" onclick="window.recuperarPassword()">¿Olvidaste tu contraseña?</button>
        </div>

        <!-- 2. PANEL PRIVADO -->
        <div id="adminSection" class="card hidden">
            <h1>Leitmix Producciones</h1>
            <p id="userLoggedEmail" style="text-align: center; color: #aaa; margin-bottom: 15px; font-size: 0.85rem; word-break: break-all;"></p>
            <button id="btnLogout" class="btn-danger">Cerrar Sesión</button>

            <hr>

            <!-- Resumen y Reservas -->
            <div>
                <h2>📊 Resumen y Reservas</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <p style="font-size: 0.8rem; color: #ccc;">Reservas</p>
                        <h3 id="totalReservas">0</h3>
                    </div>
                    <div class="stat-box">
                        <p style="font-size: 0.8rem; color: #ccc;">Recaudado</p>
                        <h3 id="totalRecibos">$0</h3>
                    </div>
                </div>

                <h3 style="color: #ffc107; font-size: 1rem; margin: 15px 0 8px 0;">📅 Listado de Reservas</h3>
                <div id="listaReservasAdmin" class="scroll-section">
                    <p style="color: #888; text-align: center; font-size: 0.9rem;">Cargando reservas...</p>
                </div>
            </div>

            <hr>

            <!-- Gestión de Recibos -->
            <div>
                <h2>💵 Gestión de Recibos</h2>
                <form id="reciboForm" style="display: flex; flex-direction: column; gap: 10px; background: #252525; padding: 15px; border-radius: 10px; border: 1px solid #444;">
                    <input type="text" id="reciboCliente" placeholder="Nombre del cliente" required style="margin-bottom: 0;">
                    <input type="number" step="0.01" id="reciboMonto" placeholder="Monto ($)" required style="margin-bottom: 0;">
                    <input type="text" id="reciboDetalle" placeholder="Concepto o seña" required style="margin-bottom: 0;">
                    <button type="submit" class="btn-main" style="margin-top: 5px; margin-bottom: 0;">Crear Recibo</button>
                </form>

                <h3 style="color: #ffc107; font-size: 1rem; margin: 15px 0 8px 0;">📋 Recibos Emitidos</h3>
                <div id="listaRecibosAdmin" class="scroll-section">
                    <p style="color: #888; text-align: center;">Cargando recibos...</p>
                </div>
            </div>

            <hr>

            <!-- Subida Multimedia -->
            <div>
                <h2>📁 Contenido Multimedia</h2>
                <form id="mediaForm" style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="file" id="mediaFile" accept="image/*,video/*" required style="padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 10px;">
                    <button type="submit" class="btn-main">Subir Archivo</button>
                </form>
                <div id="listaMediaAdmin" class="scroll-section" style="margin-top: 10px;">
                    <p style="color: #888; text-align: center;">Cargando archivos...</p>
                </div>
            </div>

            <hr>

            <!-- Testimonios -->
            <div>
                <h2>💬 Moderar Testimonios</h2>
                <div id="listaTestimoniosAdmin" class="scroll-section">
                    <p style="color: #888; text-align: center;">Cargando testimonios...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./panel.js"></script>
</body>
</html>
