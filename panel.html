<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Pro - Producciones Manager</title>
    <!-- Enlace para la aplicación instalable -->
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-input: #1a233a;
            --border-color: #22304d;
            --accent: #ffc107;
            --accent-hover: #e0a800;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* LOGIN */
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at center, #1b263b 0%, var(--bg-main) 100%);
        }

        .login-card {
            background: var(--bg-card);
            padding: 35px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .login-card h2 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        /* ADMIN PANEL */
        #adminSection {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 15px 50px 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .btn-icon:hover { border-color: var(--accent); }

        .btn-danger-subtle {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* SECCIONES / TARJETAS */
        .dashboard-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .dashboard-card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* FORMULARIOS E INPUTS */
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media(min-width: 640px) {
            .form-grid { grid-template-columns: 2fr 1fr 2fr auto; }
        }

        .btn-primary {
            background: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.98); }

        .stat-badge {
            display: inline-block;
            background: rgba(255, 193, 7, 0.1);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }

        /* MODAL */
        #modalConfig {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-content h3 {
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- SECCIÓN DE LOGIN -->
    <section id="loginSection">
        <form id="loginForm" class="login-card">
            <!-- Logo de la controladora -->
            <img src="https://res.cloudinary.com/exzcoeyi/image/upload/nvzsktuzupud41gsfgbe" alt="Logo Producciones Manager" class="login-logo">
            <h2>Producciones Manager</h2>
            <div style="margin-bottom: 15px; text-align: left;">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
            </div>
            <div style="margin-bottom: 20px; text-align: left;">
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-primary">Ingresar al Sistema</button>
        </form>
    </section>

    <!-- SECCIÓN DE ADMINISTRACIÓN -->
    <section id="adminSection" class="hidden">
        
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="brand-title">⚡ Producciones Manager</div>
            <div class="top-actions">
                <button id="btnConfig" class="btn-icon" title="Configurar Perfil">⚙️</button>
                <button id="btnLogout" class="btn-danger-subtle">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Reservas -->
        <div class="dashboard-card">
            <h2>📊 Resumen y Reservas</h2>
            <div class="stat-badge">Total de Reservas: <span id="totalReservas">0</span></div>
            <div id="listaReservasAdmin"></div>
        </div>

        <!-- Recibos -->
        <div class="dashboard-card">
            <h2>💰 Gestión de Recibos</h2>
            <form id="reciboForm" class="form-grid">
                <input type="text" id="reciboCliente" placeholder="Nombre del cliente" required>
                <input type="number" id="reciboMonto" placeholder="Monto ($)" required>
                <input type="text" id="reciboDetalle" placeholder="Concepto o seña" required>
                <button type="submit" class="btn-primary">Crear</button>
            </form>
            <div id="listaRecibosAdmin" style="margin-top: 15px;"></div>
            <div class="stat-badge" style="margin-top: 15px;">Recaudado Total: <span id="totalRecibos">$0</span></div>
        </div>

        <!-- Multimedia -->
        <div class="dashboard-card">
            <h2>📁 Contenido Multimedia</h2>
            <form id="mediaForm" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="file" id="mediaFile" accept="image/*,video/*" required style="padding: 10px; background: var(--bg-input);">
                <button type="submit" class="btn-primary">Subir Archivo a Cloudinary</button>
            </form>
            <div id="listaMediaAdmin" style="margin-top: 15px;"></div>
        </div>

        <!-- Testimonios -->
        <div class="dashboard-card">
            <h2>💬 Moderar Testimonios</h2>
            <div id="listaTestimoniosAdmin"></div>
        </div>
    </section>

    <!-- MODAL DE CONFIGURACIÓN -->
    <div id="modalConfig">
        <div class="modal-content">
            <h3>⚙️ Configuración de Perfil</h3>
            <form id="perfilForm">
                <div class="input-group">
                    <label>Nombre Artístico / DJ</label>
                    <input type="text" id="perfilNombre" required>
                </div>
                <div class="input-group">
                    <label>Teléfono de Contacto</label>
                    <input type="text" id="perfilTelefono">
                </div>
                <div class="input-group">
                    <label>Instagram / Redes</label>
                    <input type="text" id="perfilInstagram">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary" style="flex: 1;">Guardar</button>
                    <button type="button" id="cerrarModal" class="btn-danger-subtle" style="flex: 1; text-align: center; border: none;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="panel.js"></script>
</body>
</html>
