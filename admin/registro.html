<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta - Leitmix Panel</title>
<style>
    body{ margin:0; height:100vh; display:flex; justify-content:center; align-items:center; background:#050505; font-family:Arial; color:white; }
    .registro{ width:90%; max-width:350px; background:#111; padding:25px; border-radius:15px; border:1px solid #f5b400; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2{ text-align:center; color:#f5b400; margin-bottom: 15px; }
    input,button{ width:100%; padding:12px; margin-top:10px; border-radius:8px; box-sizing:border-box; font-size: 1rem; }
    input{ background:#222; border:1px solid #444; color:white; }
    input:focus{ outline: none; border-color: #f5b400; }
    button{ background:#f5b400; border:0; font-weight:bold; cursor:pointer; color: #121212; transition: background 0.3s; }
    button:hover{ background: #e0a800; }
    #mensaje{ text-align:center; margin-top:15px; color:#ffc107; font-size: 0.9rem; }
    .link-login { text-align: center; margin-top: 15px; font-size: 0.85rem; }
    .link-login a { color: #f5b400; text-decoration: none; }
    .link-login a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="registro">
    <h2>Crear cuenta DJ</h2>

    <input id="nombre" placeholder="Nombre artístico">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Contraseña">
    <input id="whatsapp" placeholder="WhatsApp">
    <input id="ciudad" placeholder="Ciudad">

    <button id="crear">Crear cuenta</button>

    <p id="mensaje"></p>

    <div class="link-login">
        <p>¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
</div>

<script type="module">
import { supabase } from "../supabase.js";

document.getElementById("crear").onclick = async () => {
    const nombre = document.getElementById("nombre").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const ciudad = document.getElementById("ciudad").value.trim();
    const mensajeEl = document.getElementById("mensaje");

    if (!nombre || !email || !password) {
        mensajeEl.textContent = "Completá al menos nombre, email y contraseña.";
        return;
    }

    mensajeEl.textContent = "Creando cuenta...";

    // 1. Registrar en Auth de Supabase
    const { data, error } = await supabase.auth.signUp({
        email,
        password
    });

    if (error) {
        mensajeEl.textContent = "Error: " + error.message;
        return;
    }

    const user = data.user;
    if (!user) {
        mensajeEl.textContent = "Error al obtener datos del usuario.";
        return;
    }

    // 2. Guardar el perfil asociado
    const { error: perfilError } = await supabase
        .from("perfiles")
        .insert({
            id: user.id,
            nombre_artistico: nombre,
            email,
            whatsapp,
            ciudad
        });

    if (perfilError) {
        mensajeEl.textContent = "Error en perfil: " + perfilError.message;
        return;
    }

    mensajeEl.textContent = "¡Cuenta creada con éxito! Redirigiendo...";
    
    setTimeout(() => {
        window.location.href = "login.html";
    }, 2000);
};
</script>

</body>
</html>
