<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin - Leitmix</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; width: 85%; max-width: 320px; text-align: center; }
    h2 { color: #f5b400; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #f5b400; font-weight: bold; cursor: pointer; color: #000; font-size: 16px; }
    .error { color: #e74c3c; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎧 Iniciar Sesión</h2>
    <input type="email" id="email" placeholder="Tu Email">
    <input type="password" id="password" placeholder="Tu Contraseña">
    <button id="btnLogin" type="button">Ingresar</button>
    <div id="errorMsg" class="error"></div>
  </div>

  <script type="module">
    import { supabase } from "../supabase.js";

    const btn = document.getElementById("btnLogin");
    const errorMsg = document.getElementById("errorMsg");

    btn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      errorMsg.innerText = "Conectando...";

      if (!email || !password) {
        errorMsg.innerText = "Completá email y contraseña.";
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          errorMsg.innerText = "Error: " + error.message;
        } else {
          errorMsg.innerText = "¡Éxito! Redirigiendo...";
          window.location.href = "panel.html";
        }
      } catch (err) {
        errorMsg.innerText = "Falla de script: " + err.message;
      }
    });
  </script>
</body>
</html>
