<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Login</title>
</head>
<body style="background: #121212; color: white; text-align: center; padding-top: 50px;">
    <h2>Prueba de Carga</h2>
    <button id="btnPrueba" style="padding: 15px; font-size: 18px;">Toca este botón</button>
    <p id="texto" style="margin-top: 20px; font-size: 20px; color: yellow;"></p>

    <script type="module">
        import { supabase } from "../supabase.js";

        document.getElementById("btnPrueba").addEventListener("click", async () => {
            document.getElementById("texto").textContent = "¡El script funciona perfecto!";
            
            // Probamos conexión con Supabase
            try {
                const { data, error } = await supabase.auth.getSession();
                alert("Conexión con Supabase OK");
            } catch (err) {
                alert("Error de conexión: " + err.message);
            }
        });
    </script>
</body>
</html>
