<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Leitmix Producciones</title>
    
    <!-- Cargamos Supabase de forma directa y segura -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background: #1e1e1e; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); text-align: center; border: 1px solid #333; }
        h2 { color: #ffc107; margin-bottom: 20px; font-size: 1.6rem; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; font-size: 1rem; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        input:focus { outline: none; border-color: #ffc107; }
        button { background: #ffc107; color: #121212; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e0a800; }
        .error-msg { color: #ff6b6b; font-size: 0.9rem; margin-bottom: 15px; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 6px; display: none; text-align: left; word-break: break-all; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🎧 Iniciar Sesión</h2>
        
        <div id="errorMsg" class="error-msg"></div>

        <input type="text" id="loginEmail" placeholder="Tu Email" required>
        <input type="password" id="loginPassword" placeholder="Tu Contraseña" required>
        
        <button id="btnLogin" type="button">Ingresar</button>
    </div>

    <script>
        // Tus credenciales directas acá adentro para evitar que falle el archivo externo
        const SUPABASE_URL = "https://fevvtbbyzxvnanzeedzp.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_l8Hb4ydFb7uGcjODFG8sBg_jY-jEFrF";

        // Inicializamos Supabase de forma global
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const btnLogin = document.getElementById("btnLogin");
        const errorMsg = document.getElementById("errorMsg");

        btnLogin.addEventListener("click", async () => {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            errorMsg.style.display = "none";

            if (!email || !password) {
                errorMsg.textContent = "Por favor completa todos los campos.";
                errorMsg.style.display = "block";
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = "Ingresando...";

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    errorMsg.textContent = "Error: " + error.message;
                    errorMsg.style.display = "block";
                    btnLogin.disabled = false;
                    btnLogin.textContent = "Ingresar";
                } else {
                    window.location.href = "panel.html";
                }
            } catch (err) {
                errorMsg.textContent = "Error inesperado: " + err.message;
                errorMsg.style.display = "block";
                btnLogin.disabled = false;
                btnLogin.textContent = "Ingresar";
            }
        });
    </script>
</body>
</html>
