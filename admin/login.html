<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Leitmix Producciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background: #1e1e1e; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); text-align: center; border: 1px solid #333; }
        h2 { color: #ffc107; margin-bottom: 20px; font-size: 1.6rem; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; font-size: 1rem; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        input:focus { outline: none; border-color: #ffc107; }
        button { background: #ffc107; color: #121212; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e0a800; }
        .error-msg { color: #dc3545; font-size: 0.9rem; margin-bottom: 15px; display: none; }
        .success-msg { color: #28a745; font-size: 0.9rem; margin-bottom: 15px; display: none; }
        .forgot-link { display: block; margin-top: 10px; color: #aaa; font-size: 0.85rem; text-decoration: none; transition: color 0.3s; }
        .forgot-link:hover { color: #ffc107; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🎧 Iniciar Sesión</h2>
        
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <input type="email" id="loginEmail" placeholder="Tu Email" required>
        <input type="password" id="loginPassword" placeholder="Tu Contraseña" required>
        
        <button id="btnLogin">Ingresar</button>

        <a href="#" id="btnForgot" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

    <script type="module">
        import { supabase } from "../supabase.js";

        const btnLogin = document.getElementById("btnLogin");
        const errorMsg = document.getElementById("errorMsg");
        const successMsg = document.getElementById("successMsg");
        const btnForgot = document.getElementById("btnForgot");

        // Iniciar Sesión
        btnLogin.addEventListener("click", async () => {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            if (!email || !password) {
                errorMsg.textContent = "Por favor completa todos los campos.";
                errorMsg.style.display = "block";
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = "Ingresando...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.textContent = "Credenciales incorrectas o usuario no registrado.";
                errorMsg.style.display = "block";
                btnLogin.disabled = false;
                btnLogin.textContent = "Ingresar";
            } else {
                window.location.href = "panel.html";
            }
        });

        // Recuperar Contraseña
        btnForgot.addEventListener("click", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();

            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            if (!email) {
                errorMsg.textContent = "Por favor ingresa tu email arriba para recuperar la contraseña.";
                errorMsg.style.display = "block";
                return;
            }

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + "/leitmix-producciones-web/admin/nueva-password.html", 
            });

            if (error) {
                errorMsg.textContent = "Error al enviar correo: " + error.message;
                errorMsg.style.display = "block";
            } else {
                successMsg.textContent = "¡Correo de recuperación enviado! Revisa tu bandeja de entrada.";
                successMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
