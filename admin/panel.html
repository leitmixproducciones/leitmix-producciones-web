<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Leitmix Producciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #ffc107; margin-bottom: 15px; font-size: 1.8rem; }
        h2 { color: #ffc107; margin-bottom: 15px; font-size: 1.4rem; }
        p { color: #aaa; margin-bottom: 15px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: none; font-size: 1rem; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        button { background: #ffc107; color: #121212; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #bd2130; }
        .btn-small { padding: 6px 12px; font-size: 0.85rem; width: auto; }
        .stat-number { font-size: 2.5rem; color: #ffc107; font-weight: bold; margin-bottom: 10px; }
        
        /* Estilos para la lista con miniatura */
        .file-item { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: left; }
        .file-info { display: flex; align-items: center; gap: 10px; overflow: hidden; margin-right: 10px; }
        .file-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #000; }
        .file-name { font-size: 0.85rem; color: #fff; word-break: break-all; }
        .success-msg { color: #28a745; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel Principal -->
        <div class="card">
            <h1>Panel de Control</h1>
            <button id="btnLogout" class="btn-danger">Cerrar sesión</button>
        </div>

        <!-- Resumen -->
        <div class="card">
            <h2>📊 Resumen</h2>
            <p>Total de Reservas Recibidas</p>
            <div id="totalReservas" class="stat-number">0</div>
        </div>

        <!-- Gestión de Fotos y Videos -->
        <div class="card">
            <h2>📸 Gestión de Fotos y Videos</h2>
            <div id="uploadMsg" class="success-msg"></div>
            <input type="file" id="fileInput" accept="image/*,video/*">
            <button id="btnUpload">Subir Archivo</button>
            <p style="margin-top: 15px; font-weight: bold; color: #fff; text-align: left;">Archivos subidos:</p>
            <div id="fileList">Cargando archivos...</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from "../supabase.js";

        // 1. Verificar sesión
        const checkAuth = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = "login.html";
            }
        };
        checkAuth();

        // 2. Cerrar sesión
        document.getElementById("btnLogout").addEventListener("click", async () => {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        });

        // 3. Cargar Resumen de Reservas
        async function cargarResumen() {
            try {
                const { count } = await supabase
                    .from('reservas')
                    .select('*', { count: 'exact', head: true });
                if (count !== null) {
                    document.getElementById("totalReservas").textContent = count;
                }
            } catch (err) {
                console.error(err);
            }
        }
        cargarResumen();

        // 4. Listar Archivos con Miniaturas
        const fileList = document.getElementById("fileList");

        async function cargarArchivosAdmin() {
            try {
                fileList.innerHTML = "<p style='color: #aaa;'>Cargando archivos...</p>";
                let listaFinal = [];

                for (let carpeta of ['imagenes', 'videos']) {
                    const { data: files, error } = await supabase.storage
                        .from('Media')
                        .list(carpeta, { limit: 50 });

                    if (!error && files) {
                        files.forEach(file => {
                            if (file.name !== '.emptyFolderPlaceholder') {
                                listaFinal.push({
                                    name: `${carpeta}/${file.name}`,
                                    path: `${carpeta}/${file.name}`
                                });
                            }
                        });
                    }
                }

                if (listaFinal.length === 0) {
                    fileList.innerHTML = "<p style='color: #aaa;'>No hay archivos subidos.</p>";
                    return;
                }

                fileList.innerHTML = "";
                listaFinal.forEach(file => {
                    const { data: publicUrlData } = supabase.storage
                        .from('Media')
                        .getPublicUrl(file.name);

                    const itemDiv = document.createElement("div");
                    itemDiv.className = "file-item";

                    const infoDiv = document.createElement("div");
                    infoDiv.className = "file-info";

                    const fileNameLower = file.name.toLowerCase();
                    const isVideo = fileNameLower.endsWith('.mp4') || fileNameLower.endsWith('.webm') || fileNameLower.endsWith('.mov');

                    if (isVideo) {
                        const videoThumb = document.createElement("video");
                        videoThumb.className = "file-thumb";
                        videoThumb.src = publicUrlData.publicUrl;
                        infoDiv.appendChild(videoThumb);
                    } else {
                        const imgThumb = document.createElement("img");
                        imgThumb.className = "file-thumb";
                        imgThumb.src = publicUrlData.publicUrl;
                        imgThumb.alt = "Miniatura";
                        infoDiv.appendChild(imgThumb);
                    }

                    const nameSpan = document.createElement("span");
                    nameSpan.className = "file-name";
                    nameSpan.textContent = file.name;
                    infoDiv.appendChild(nameSpan);

                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "btn-danger btn-small";
                    deleteBtn.textContent = "Borrar";
                    
                    deleteBtn.onclick = async () => {
                        if (confirm(`¿Estás seguro de borrar este archivo?`)) {
                            const { error: errDel } = await supabase.storage
                                .from('Media')
                                .remove([file.path]);

                            if (errDel) {
                                alert("Error al borrar: " + errDel.message);
                            } else {
                                cargarArchivosAdmin();
                            }
                        }
                    };

                    itemDiv.appendChild(infoDiv);
                    itemDiv.appendChild(deleteBtn);
                    fileList.appendChild(itemDiv);
                });

            } catch (err) {
                fileList.innerHTML = "<p style='color: #ff6b6b;'>Error al conectar con el bucket.</p>";
            }
        }
        cargarArchivosAdmin();

        // 5. Subir Archivos
        const btnUpload = document.getElementById("btnUpload");
        const fileInput = document.getElementById("fileInput");
        const uploadMsg = document.getElementById("uploadMsg");

        btnUpload.addEventListener("click", async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Por favor selecciona un archivo primero.");
                return;
            }

            uploadMsg.textContent = "Subiendo archivo...";
            btnUpload.disabled = true;

            const isVideo = file.type.includes('video') || file.name.toLowerCase().endsWith('.mp4') || file.name.toLowerCase().endsWith('.mov');
            const folder = isVideo ? 'videos' : 'imagenes';
            const filePath = `${folder}/${Date.now()}_${file.name}`;

            const { error } = await supabase.storage
                .from('Media')
                .upload(filePath, file);

            btnUpload.disabled = false;
            fileInput.value = "";

            if (error) {
                uploadMsg.style.color = "#dc3545";
                uploadMsg.textContent = "Error: " + error.message;
            } else {
                uploadMsg.style.color = "#28a745";
                uploadMsg.textContent = "¡Subido con éxito!";
                cargarArchivosAdmin();
                setTimeout(() => { uploadMsg.textContent = ""; }, 3000);
            }
        });
    </script>
</body>
</html>
