<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Leitmix Producciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #ffc107; margin-bottom: 15px; font-size: 1.8rem; }
        h2 { color: #ffc107; margin-bottom: 15px; font-size: 1.4rem; }
        p { color: #aaa; margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: none; font-size: 1rem; }
        input, select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        button { background: #ffc107; color: #121212; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #bd2130; }
        .btn-small { padding: 6px 12px; font-size: 0.85rem; width: auto; }
        .stat-number { font-size: 2.5rem; color: #ffc107; font-weight: bold; margin-bottom: 10px; }
        
        .file-item { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: left; }
        .file-info { display: flex; align-items: center; gap: 10px; overflow: hidden; margin-right: 10px; }
        .file-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #000; }
        .file-title { font-size: 0.9rem; color: #fff; font-weight: bold; word-break: break-all; }
        .success-msg { color: #28a745; margin-bottom: 15px; font-weight: bold; }
        .section-title { color: #ffc107; text-align: left; margin: 15px 0 8px 0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel Principal -->
        <div class="card">
            <h1>Panel de Control</h1>
            <button id="btnLogout" class="btn-danger">Cerrar sesión</button>
        </div>

        <!-- Resumen -->
        <div class="card">
            <h2>📊 Resumen</h2>
            <p>Total de Reservas Recibidas</p>
            <div id="totalReservas" class="stat-number">0</div>
        </div>

        <!-- Gestión de Fotos y Videos -->
        <div class="card">
            <h2>📸 Gestión de Contenido</h2>
            <div id="uploadMsg" class="success-msg"></div>
            
            <input type="text" id="tituloInput" placeholder="Título del archivo (Ej: Video Show)">
            <select id="tipoSelect">
                <option value="galeria">Tabla: Galería (Fotos)</option>
                <option value="videos">Tabla: Videos</option>
            </select>
            <input type="file" id="fileInput" accept="image/*,video/*">
            <button id="btnUpload">Subir y Registrar</button>

            <!-- Listado de Galería -->
            <div class="section-title">🖼️ Elementos en Tabla 'galeria'</div>
            <div id="galeriaList">Cargando fotos...</div>

            <!-- Listado de Videos -->
            <div class="section-title">🎬 Elementos en Tabla 'videos'</div>
            <div id="videosList">Cargando videos...</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from "../supabase.js";

        // 1. Verificar sesión
        const checkAuth = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = "login.html";
            }
        };
        checkAuth();

        // 2. Cerrar sesión
        document.getElementById("btnLogout").addEventListener("click", async () => {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        });

        // 3. Cargar Resumen de Reservas
        async function cargarResumen() {
            try {
                const { count } = await supabase
                    .from('reservas')
                    .select('*', { count: 'exact', head: true });
                if (count !== null) {
                    document.getElementById("totalReservas").textContent = count;
                }
            } catch (err) {
                console.error(err);
            }
        }
        cargarResumen();

        // 4. Cargar tabla 'galeria' y tabla 'videos' por separado
        const galeriaList = document.getElementById("galeriaList");
        const videosList = document.getElementById("videosList");

        async function cargarContenidoAdmin() {
            // Cargar Galería
            try {
                galeriaList.innerHTML = "<p style='color: #aaa;'>Cargando...</p>";
                const { data: galeria, error } = await supabase.from('galeria').select('*');
                
                if (error) {
                    galeriaList.innerHTML = `<p style='color: #ff6b6b;'>Error: ${error.message}</p>`;
                } else if (!galeria || galeria.length === 0) {
                    galeriaList.innerHTML = "<p style='color: #aaa;'>No hay fotos en galería.</p>";
                } else {
                    galeriaList.innerHTML = "";
                    galeria.forEach(item => {
                        const url = item.Imagen || item.url || item.imagen;
                        const itemDiv = crearItemUI(item.id, item.Titulo || 'Sin título', url, 'galeria');
                        galeriaList.appendChild(itemDiv);
                    });
                }
            } catch (e) {
                galeriaList.innerHTML = "<p style='color: #ff6b6b;'>Error al cargar galería.</p>";
            }

            // Cargar Videos
            try {
                videosList.innerHTML = "<p style='color: #aaa;'>Cargando...</p>";
                const { data: videos, error } = await supabase.from('videos').select('*');
                
                if (error) {
                    videosList.innerHTML = `<p style='color: #ff6b6b;'>Error: ${error.message}</p>`;
                } else if (!videos || videos.length === 0) {
                    videosList.innerHTML = "<p style='color: #aaa;'>No hay videos registrados.</p>";
                } else {
                    videosList.innerHTML = "";
                    videos.forEach(item => {
                        // Ajustá 'item.url' o 'item.Video' o 'item.Imagen' según cómo se llame la columna en tu tabla 'videos'
                        const url = item.url || item.Video || item.video || item.Imagen;
                        const itemDiv = crearItemUI(item.id, item.Titulo || item.titulo || 'Sin título', url, 'videos');
                        videosList.appendChild(itemDiv);
                    });
                }
            } catch (e) {
                videosList.innerHTML = "<p style='color: #ff6b6b;'>Error al cargar videos.</p>";
            }
        }

        // Función auxiliar para armar el diseño de cada fila
        function crearItemUI(id, titulo, url, tabla) {
            const itemDiv = document.createElement("div");
            itemDiv.className = "file-item";

            const infoDiv = document.createElement("div");
            infoDiv.className = "file-info";

            if (url && (url.endsWith('.mp4') || url.endsWith('.mov') || tabla === 'videos')) {
                const videoThumb = document.createElement("video");
                videoThumb.className = "file-thumb";
                videoThumb.src = url;
                infoDiv.appendChild(videoThumb);
            } else if (url) {
                const imgThumb = document.createElement("img");
                imgThumb.className = "file-thumb";
                imgThumb.src = url;
                imgThumb.alt = "Miniatura";
                infoDiv.appendChild(imgThumb);
            }

            const titleSpan = document.createElement("span");
            titleSpan.className = "file-title";
            titleSpan.textContent = titulo;
            infoDiv.appendChild(titleSpan);

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "btn-danger btn-small";
            deleteBtn.textContent = "Borrar";
            
            deleteBtn.onclick = async () => {
                if (confirm(`¿Borrar "${titulo}" de la tabla ${tabla}?`)) {
                    const { error: errDel } = await supabase
                        .from(tabla)
                        .delete()
                        .eq('id', id);

                    if (errDel) {
                        alert("Error al borrar: " + errDel.message);
                    } else {
                        cargarContenidoAdmin();
                    }
                }
            };

            itemDiv.appendChild(infoDiv);
            itemDiv.appendChild(deleteBtn);
            return itemDiv;
        }

        cargarContenidoAdmin();

        // 5. Subir Archivo y registrarlo en la tabla elegida
        const btnUpload = document.getElementById("btnUpload");
        const fileInput = document.getElementById("fileInput");
        const tituloInput = document.getElementById("tituloInput");
        const tipoSelect = document.getElementById("tipoSelect");
        const uploadMsg = document.getElementById("uploadMsg");

        btnUpload.addEventListener("click", async () => {
            const file = fileInput.files[0];
            const titulo = tituloInput.value.trim();
            const tablaDestino = tipoSelect.value; // 'galeria' o 'videos'

            if (!file || !titulo) {
                alert("Por favor completa el título y selecciona un archivo.");
                return;
            }

            uploadMsg.textContent = "Subiendo archivo...";
            btnUpload.disabled = true;

            const folder = tablaDestino === 'videos' ? 'videos' : 'imagenes';
            const filePath = `${folder}/${Date.now()}_${file.name}`;

            // 1. Subir al Storage de Supabase
            const { error: uploadError } = await supabase.storage
                .from('Media')
                .upload(filePath, file);

            if (uploadError) {
                uploadMsg.style.color = "#dc3545";
                uploadMsg.textContent = "Error al subir: " + uploadError.message;
                btnUpload.disabled = false;
                return;
            }

            // 2. Obtener URL pública
            const { data: publicUrlData } = supabase.storage
                .from('Media')
                .getPublicUrl(filePath);

            // 3. Guardar en la tabla correspondiente (galeria o videos)
            // Nota: Si tu columna en la tabla videos se llama 'url' o 'Video', ajustala acá si hiciera falta.
            const datosInserta = tablaDestino === 'galeria' 
                ? { Titulo: titulo, Imagen: publicUrlData.publicUrl }
                : { Titulo: titulo, url: publicUrlData.publicUrl }; // Cambiar 'url' por 'Video' si tu columna se llama así en la tabla videos

            const { error: dbError } = await supabase
                .from(tablaDestino)
                .insert([datosInserta]);

            btnUpload.disabled = false;
            fileInput.value = "";
            tituloInput.value = "";

            if (dbError) {
                uploadMsg.style.color = "#dc3545";
                uploadMsg.textContent = "Error en base de datos: " + dbError.message;
            } else {
                uploadMsg.style.color = "#28a745";
                uploadMsg.textContent = "¡Agregado con éxito!";
                cargarContenidoAdmin();
                setTimeout(() => { uploadMsg.textContent = ""; }, 3000);
            }
        });
    </script>
</body>
</html>
