<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Leitmix Producciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        h2 { color: #ffc107; }
        .admin-section { background: #1e1e1e; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid #333; }
        h3 { color: #ffc107; margin-bottom: 15px; font-size: 1.3rem; }
        .testimonio-item { background: #2a2a2a; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; }
        .btn-accion { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; }
        .btn-aprobar { background: #28a745; color: white; }
        .btn-desaprobar { background: #dc3545; color: white; }
        .estado-aprobado { color: #28a745; font-size: 0.85rem; }
        .estado-pendiente { color: #ffc107; font-size: 0.85rem; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; margin-top: 5px; }
        button.btn-main { background: #ffc107; color: #121212; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button.btn-main:hover { background: #e0a800; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🎛️ Panel de Control - Leitmix</h2>
        <button id="btnCerrarSesion" style="background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">Cerrar Sesión</button>
    </div>

    <!-- SECCIÓN 1: TESTIMONIOS -->
    <div class="admin-section">
        <h3>⭐ Moderación de Testimonios</h3>
        <div id="listaTestimonios">Cargando testimonios...</div>
    </div>

    <!-- SECCIÓN 2: GESTIÓN DE FOTOS Y VIDEOS -->
    <div class="admin-section">
        <h3>📸 Subir Fotos / Videos</h3>
        <div class="form-group">
            <label>Título del contenido:</label>
            <input type="text" id="mediaTitulo" placeholder="Ej: Sesión en vivo">
        </div>
        <div class="form-group">
            <label>URL o Enlace del archivo:</label>
            <input type="text" id="mediaUrl" placeholder="Enlace de la imagen o video">
        </div>
        <button class="btn-main" id="btnSubirMedia">Guardar Contenido</button>
    </div>

    <!-- SECCIÓN 3: GENERADOR DE RECIBOS -->
    <div class="admin-section">
        <h3>🧾 Generador de Recibos</h3>
        <div class="form-group">
            <label>Nombre del Cliente:</label>
            <input type="text" id="reciboCliente" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label>Monto ($):</label>
            <input type="number" id="reciboMonto" placeholder="0.00">
        </div>
        <button class="btn-main" id="btnGenerarRecibo">Generar Recibo</button>
        <div id="vistaRecibo" style="margin-top: 15px; color: #ccc;"></div>
    </div>

    <script type="module">
        import { supabase } from "../supabase.js";

        // Verificar sesión activa
        async function verificarSesion() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = "login.html";
            }
        }
        verificarSesion();

        // Cerrar sesión
        document.getElementById("btnCerrarSesion").addEventListener("click", async () => {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        });

        // 1. Cargar Testimonios
        async function cargarTestimoniosPendientes() {
            const contenedor = document.getElementById("listaTestimonios");
            
            const { data, error } = await supabase
                .from("testimonios")
                .select("*")
                .order("id", { ascending: false });

            if (error) {
                contenedor.innerHTML = `<p style="color: #dc3545;">Error de Supabase: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                contenedor.textContent = "No hay testimonios registrados en la tabla.";
                return;
            }

            contenedor.innerHTML = "";
            data.forEach(t => {
                const div = document.createElement("div");
                div.className = "testimonio-item";
                
                const estrellasHTML = "⭐".repeat(t.estrellas || 5);
                const estadoTexto = t.aprobado ? 'Aprobado (Visible en web)' : 'Pendiente de aprobación';
                const claseEstado = t.aprobado ? 'estado-aprobado' : 'estado-pendiente';
                const textoBoton = t.aprobado ? 'Desaprobar' : 'Aprobar';
                const claseBoton = t.aprobado ? 'btn-desaprobar' : 'btn-aprobar';

                div.innerHTML = `
                    <p><strong>${t.nombre}</strong> <span style="margin-left: 10px;">${estrellasHTML}</span></p>
                    <p style="margin: 8px 0; color: #ccc; font-style: italic;">"${t.comentario}"</p>
                    <p class="${claseEstado}">Estado: <strong>${estadoTexto}</strong></p>
                    <button class="btn-accion ${claseBoton}" onclick="window.cambiarEstado(${t.id}, ${!t.aprobado})">
                        ${textoBoton}
                    </button>
                `;
                contenedor.appendChild(div);
            });
        }

        window.cambiarEstado = async function(id, nuevoEstado) {
            const { error } = await supabase
                .from("testimonios")
                .update({ aprobado: nuevoEstado })
                .eq("id", id);

            if (error) {
                alert("Error al actualizar: " + error.message);
            } else {
                cargarTestimoniosPendientes();
            }
        }

        // 2. Lógica para Fotos/Videos (Placeholder funcional)
        document.getElementById("btnSubirMedia").addEventListener("click", () => {
            const titulo = document.getElementById("mediaTitulo").value;
            const url = document.getElementById("mediaUrl").value;
            if(!titulo || !url) {
                alert("Por favor completa los campos de contenido.");
                return;
            }
            alert("Contenido listo para registrar en tu base de datos.");
        });

        // 3. Lógica para Recibos
        document.getElementById("btnGenerarRecibo").addEventListener("click", () => {
            const cliente = document.getElementById("reciboCliente").value;
            const monto = document.getElementById("reciboMonto").value;
            const vista = document.getElementById("vistaRecibo");

            if(!cliente || !monto) {
                alert("Completa el cliente y el monto.");
                return;
            }

            vista.innerHTML = `
                <div style="background: #2a2a2a; padding: 10px; border-radius: 6px; border: 1px solid #444;">
                    <p><strong>Recibo generado para:</strong> ${cliente}</p>
                    <p><strong>Monto:</strong> $${monto}</p>
                    <p style="color: #28a745; font-size: 0.85rem;">✔ Listo para imprimir o descargar</p>
                </div>
            `;
        });

        cargarTestimoniosPendientes();
    </script>
</body>
</html>
