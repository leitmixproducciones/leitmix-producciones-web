<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Leitmix Producciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #f1f1f1; padding: 20px; max-width: 800px; margin: 0 auto; }
        
        .admin-card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2, h3 { color: #ffc107; margin-bottom: 15px; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #ffc107; }

        button { padding: 12px; border-radius: 8px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; width: 100%; margin-top: 5px; }
        .btn-main { background: #ffc107; color: #121212; }
        .btn-main:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }

        .item-card { background: #2a2a2a; padding: 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; text-align: left; }
        .grid-fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 15px; }
        .stats-container { display: flex; gap: 15px; justify-content: space-around; margin-bottom: 15px; text-align: center; }
        .stat-box { background: #2a2a2a; padding: 10px; border-radius: 8px; flex: 1; border: 1px solid #444; }

        details summary { cursor: pointer; color: #ffc107; font-size: 1.1rem; font-weight: bold; outline: none; padding: 2px 0; }
        details[open] summary { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    </style>
</head>
<body>

    <!-- CABECERA / CERRAR SESIÓN -->
    <div class="admin-card" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Panel de Control</h2>
        <button class="btn-danger" id="cerrarSesion" style="width: auto; padding: 8px 15px; font-size: 0.9rem; margin-top: 0;">Cerrar sesión</button>
    </div>

    <!-- CONFIGURACIÓN DE LA WEB (MENÚ DESPLEGABLE) -->
    <div class="admin-card">
        <details>
            <summary>⚙️ Configuración del Negocio</summary>
            <input type="text" id="cfgNombre" placeholder="Nombre de Fantasía (Ej: Leitmix Producciones)">
            <input type="text" id="cfgWhatsapp" placeholder="Teléfono WhatsApp (Ej: 54911...)">
            <input type="text" id="cfgAlias" placeholder="Alias de Pago (Ej: leitmix.mp)">
            <input type="text" id="cfgInstagram" placeholder="URL de Instagram">
            <button class="btn-main" id="btnGuardarConfig">Guardar Configuración</button>
        </details>
    </div>

    <!-- GESTIÓN DE FOTOS (GALERÍA) -->
    <div class="admin-card">
        <h3>📸 Gestión de Fotos</h3>
        <input type="text" id="fotoTitulo" placeholder="Título o Descripción de la foto">
        <input type="file" id="fotoArchivo" accept="image/*" style="background: #2a2a2a; padding: 10px;">
        <button class="btn-main" id="btnSubirFoto">Subir Foto a la Web</button>
        
        <div class="grid-fotos" id="listaFotos">
            <!-- Las fotos cargadas aparecerán aquí automáticamente -->
        </div>
    </div>

    <!-- GESTIÓN DE VIDEOS -->
    <div class="admin-card">
        <h3>🎬 Gestión de Videos</h3>
        <input type="text" id="videoTitulo" placeholder="Título o Descripción del video">
        <input type="text" id="videoUrl" placeholder="URL del video (Ej: Link de YouTube)">
        <button class="btn-main" id="btnSubirVideo">Subir Video a la Web</button>
        
        <div class="grid-fotos" id="listaVideos">
            <!-- Los videos cargados aparecerán aquí automáticamente -->
        </div>
    </div>

    <!-- SECCIÓN DE RESERVAS -->
    <div class="admin-card">
        <h3>📅 Reservas y Estadísticas</h3>
        <div class="stats-container">
            <div class="stat-box"><small>Total</small><h2 id="dashTotalReservas" style="color:#ffc107;">0</h2></div>
            <div class="stat-box"><small>Confirmadas</small><h2 id="dashConfirmadas" style="color:#28a745;">0</h2></div>
            <div class="stat-box"><small>Pendientes</small><h2 id="dashPendientes" style="color:#ffc107;">0</h2></div>
        </div>
        <div id="listaReservas">Cargando reservas...</div>
    </div>

    <!-- EMISIÓN DE RECIBOS -->
    <div class="admin-card">
        <h3>🧾 Emitir Recibo de Pago</h3>
        <input type="text" id="recNombre" placeholder="Nombre del Cliente">
        <input type="text" id="recEvento" placeholder="Tipo de Evento (Ej: Casamiento / 15 Años)">
        <input type="date" id="recFecha">
        <input type="number" id="recTotal" placeholder="Precio Total ($)">
        <input type="number" id="recImporte" placeholder="Seña / Importe Abonado ($)">
        <input type="text" id="recConcepto" placeholder="Concepto (Ej: Seña inicial)">
        <button class="btn-main" id="btnCrearRecibo">Generar y Guardar Recibo</button>

        <div style="margin-top: 20px;" id="listaRecibos">
            <!-- Historial de recibos -->
        </div>
    </div>

    <!-- Script principal corregido con ruta relativa hacia la raíz -->
    <script type="module" src="../admin.js"></script>
</body>
</html>
