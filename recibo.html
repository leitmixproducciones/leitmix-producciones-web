<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Pago</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .recibo-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            width: 100%;
            max-width: 650px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #f5b400;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .header img {
            max-height: 50px;
            margin-bottom: 5px;
            object-fit: contain;
        }
        .header h1 {
            margin: 0;
            color: #f5b400;
            font-size: 20px;
        }
        .header p {
            margin: 3px 0 0;
            color: #aaa;
            font-size: 12px;
        }
        .info-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
            background: #222;
            padding: 10px 14px;
            border-radius: 6px;
            gap: 10px;
        }
        .info-column {
            flex: 1;
        }
        .info-column p {
            margin: 3px 0;
        }
        .detalles-tabla {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }
        .detalles-tabla th, .detalles-tabla td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .detalles-tabla th {
            color: #f5b400;
        }
        .totales-box {
            background: #222;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .totales-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .totales-row.total-final {
            font-size: 14px;
            font-weight: bold;
            color: #f5b400;
            border-top: 1px solid #444;
            padding-top: 6px;
            margin-top: 6px;
        }
        .observaciones-box {
            background: #161616;
            border-left: 3px solid #f5b400;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #ccc;
        }
        .footer-contacto {
            text-align: center;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .footer-contacto p {
            margin: 2px 0;
        }
        .acciones {
            text-align: center;
            margin-top: 15px;
        }
        .btn {
            background: #f5b400;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #d49a00;
        }

        /* CONFIGURACIÓN EXACTA PARA 1 SOLA PÁGINA A4 EN IMPRESIÓN */
        @media print {
            @page {
                size: A4 portrait;
                margin: 1cm; /* Margen óptimo para evitar saltos de página */
            }
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            .recibo-container {
                background: #fff !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                color: #000 !important;
                max-width: 100% !important;
                padding: 15px !important;
                page-break-inside: avoid; /* Previene la división de hojas */
            }
            .info-section, .totales-box, .observaciones-box {
                background: #f8f9fa !important;
                border: 1px solid #ddd !important;
                color: #000 !important;
            }
            .detalles-tabla th {
                color: #000 !important;
                border-bottom: 2px solid #000 !important;
            }
            .detalles-tabla td {
                border-bottom: 1px solid #ddd !important;
            }
            .totales-row.total-final {
                color: #000 !important;
                border-top: 1px solid #000 !important;
            }
            .header {
                border-bottom: 2px solid #000 !important;
            }
            .header h1 {
                color: #000 !important;
            }
            .footer-contacto {
                border-top: 1px solid #ddd !important;
                color: #444 !important;
            }
            .acciones {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="recibo-container">
        <div class="header">
            <img id="reciboLogo" src="" alt="Logo" style="display:none;">
            <h1 id="reciboNombreNegocio">Cargando comprobante...</h1>
            <p id="reciboSubtitulo">Servicios de Eventos</p>
        </div>

        <div class="info-section">
            <div class="info-column">
                <p><strong>Cliente:</strong> <span id="reciboCliente">-</span></p>
                <p><strong>Teléfono:</strong> <span id="reciboTelefono">-</span></p>
                <p><strong>Evento:</strong> <span id="reciboEvento">-</span></p>
            </div>
            <div class="info-column" style="text-align: right;">
                <p><strong>Nº Recibo:</strong> <span id="reciboNumero">-</span></p>
                <p><strong>Fecha Pago:</strong> <span id="reciboFechaPago">-</span></p>
                <p><strong>Fecha Evento:</strong> <span id="reciboFechaEvento">-</span></p>
            </div>
        </div>

        <table class="detalles-tabla">
            <thead>
                <tr>
                    <th>Concepto</th>
                    <th style="text-align: right;">Forma de Pago</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="reciboConcepto">-</td>
                    <td id="reciboFormaPago" style="text-align: right;">-</td>
                </tr>
            </tbody>
        </table>

        <div class="totales-box">
            <div class="totales-row">
                <span>Importe Total del Servicio:</span>
                <span id="reciboTotal">$0</span>
            </div>
            <div class="totales-row">
                <span>Monto Abonado en este pago:</span>
                <span id="reciboImporte" style="color: #4cd137; font-weight: bold;">$0</span>
            </div>
            <div class="totales-row total-final">
                <span>Saldo Pendiente:</span>
                <span id="reciboSaldo">$0</span>
            </div>
        </div>

        <div id="observacionesContainer" class="observaciones-box" style="display: none;">
            <strong>Observaciones:</strong> <span id="reciboObservaciones"></span>
        </div>

        <div class="footer-contacto">
            <p id="reciboContactoInfo">Cargando datos de contacto...</p>
            <p id="reciboRedesInfo"></p>
        </div>

        <div class="acciones">
            <button class="btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./admin/supabase.js";

        async function cargarDatosRecibo() {
            const params = new URLSearchParams(window.location.search);
            const idRecibo = params.get("id");

            if (!idRecibo) {
                alert("No se especificó un recibo válido.");
                return;
            }

            const { data: recibo, error: errorRecibo } = await supabase
                .from("recibos")
                .select("*")
                .eq("id", idRecibo)
                .single();

            if (errorRecibo || !recibo) {
                alert("No se encontró el registro del recibo.");
                return;
            }

            const { data: config } = await supabase
                .from("configuracion")
                .select("*")
                .eq("user_id", recibo.user_id)
                .maybeSingle();

            if (config) {
                if (config.logo) {
                    const imgLogo = document.getElementById("reciboLogo");
                    imgLogo.src = config.logo;
                    imgLogo.style.display = "inline-block";
                }
                
                const nombreNegocio = config.nombre_fantasia || config.nombre_negocio || config.nombre || "Leitmix Producciones";
                document.getElementById("reciboNombreNegocio").innerText = nombreNegocio;
                document.getElementById("reciboSubtitulo").innerText = config.subtitulo || "Servicios profesionales para eventos";

                let contactoTexto = "";
                const tel = config.telefono_whatsapp || config.whatsapp;
                if (tel) contactoTexto += `📞 WhatsApp: ${tel}`;
                const alias = config.alias_pago;
                if (alias) contactoTexto += ` &nbsp;|&nbsp; 💳 Alias: ${alias}`;
                document.getElementById("reciboContactoInfo").innerHTML = contactoTexto || "";

                let redesTexto = "";
                const ig = config.instagram_url || config.instagram;
                if (ig) redesTexto += `Instagram: ${ig}`;
                const tk = config.tiktok_url;
                if (tk) redesTexto += ` &nbsp;|&nbsp; TikTok: ${tk}`;
                document.getElementById("reciboRedesInfo").innerHTML = redesTexto || "";
            } else {
                document.getElementById("reciboNombreNegocio").innerText = "Leitmix Producciones";
            }

            document.getElementById("reciboCliente").innerText = recibo.nombre || "-";
            document.getElementById("reciboTelefono").innerText = recibo.telefono || "-";
            document.getElementById("reciboEvento").innerText = recibo.evento || "-";
            document.getElementById("reciboNumero").innerText = recibo.numero_recibo || "-";

            const fechaPago = recibo.fecha_pago ? new Date(recibo.fecha_pago).toLocaleDateString("es-AR") : "-";
            document.getElementById("reciboFechaPago").innerText = fechaPago;
            document.getElementById("reciboFechaEvento").innerText = recibo.fecha_evento || "-";

            document.getElementById("reciboConcepto").innerText = recibo.concepto || "Seña / Pago de servicio";
            document.getElementById("reciboFormaPago").innerText = recibo.forma_pago || "Efectivo / Transferencia";

            document.getElementById("reciboTotal").innerText = "$" + Number(recibo.total || 0).toLocaleString("es-AR");
            document.getElementById("reciboImporte").innerText = "$" + Number(recibo.importe || 0).toLocaleString("es-AR");
            document.getElementById("reciboSaldo").innerText = "$" + Number(recibo.saldo_pendiente || 0).toLocaleString("es-AR");

            if (recibo.observaciones && recibo.observaciones.trim() !== "") {
                document.getElementById("reciboObservaciones").innerText = recibo.observaciones;
                document.getElementById("observacionesContainer").style.display = "block";
            }
        }

        cargarDatosRecibo();
    </script>
</body>
</html>
