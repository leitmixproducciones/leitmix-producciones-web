<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Pago</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .recibo-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            width: 100%;
            max-width: 650px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #f5b400;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .logo-img {
            max-height: 60px;
            max-width: 200px;
            margin-bottom: 8px;
            object-fit: contain;
        }
        .header h1 {
            color: #f5b400;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .header p {
            color: #aaa;
            font-size: 13px;
            margin-top: 2px;
        }
        .info-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 13px;
            background: #222;
            padding: 12px;
            border-radius: 6px;
            gap: 10px;
            border: 1px solid #2a2a2a;
        }
        .info-column {
            flex: 1;
        }
        .info-column p {
            margin: 4px 0;
            line-height: 1.3;
        }
        .detalles-tabla {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
        }
        .detalles-tabla th, .detalles-tabla td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .detalles-tabla th {
            color: #f5b400;
            background: #222;
        }
        .totales-box {
            background: #222;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            border: 1px solid #2a2a2a;
        }
        .totales-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .totales-row.total-final {
            font-size: 15px;
            font-weight: bold;
            color: #f5b400;
            border-top: 1px solid #444;
            padding-top: 6px;
            margin-top: 6px;
        }
        .observaciones-box {
            background: #161616;
            border-left: 3px solid #f5b400;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 14px;
            font-size: 12px;
            color: #ccc;
        }
        .footer-contacto {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #333;
            padding-top: 12px;
            line-height: 1.5;
        }
        .footer-contacto strong {
            color: #f5b400;
        }
        .acciones {
            text-align: center;
            margin-top: 18px;
        }
        .btn {
            background: #f5b400;
            color: #000;
            border: none;
            padding: 10px 22px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #d49a00;
        }

        /* REGLAS STRICTAS IMPRESIÓN / SALIDA PDF A4 (1 HOJA ÚNICA) */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            .recibo-container {
                background: #fff !important;
                border: 1px solid #bbb !important;
                box-shadow: none !important;
                color: #000 !important;
                max-width: 100% !important;
                padding: 16px !important;
                page-break-inside: avoid !important;
            }
            .info-section, .totales-box, .observaciones-box {
                background: #f8f9fa !important;
                border: 1px solid #ddd !important;
                color: #000 !important;
            }
            .detalles-tabla th {
                color: #000 !important;
                background: #eee !important;
                border-bottom: 2px solid #000 !important;
            }
            .detalles-tabla td {
                border-bottom: 1px solid #ddd !important;
            }
            .totales-row.total-final {
                color: #000 !important;
                border-top: 1px solid #000 !important;
            }
            .header {
                border-bottom: 2px solid #000 !important;
            }
            .header h1 {
                color: #000 !important;
            }
            .footer-contacto {
                border-top: 1px solid #000 !important;
                color: #222 !important;
            }
            .footer-contacto strong {
                color: #000 !important;
            }
            .acciones {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="recibo-container">
        <div class="header">
            <div id="contenedorLogo"></div>
            <h1 id="reciboNombreNegocio">Cargando...</h1>
            <p id="reciboSubtitulo"></p>
        </div>

        <div class="info-section">
            <div class="info-column">
                <p><strong>Cliente:</strong> <span id="reciboCliente">-</span></p>
                <p><strong>Teléfono:</strong> <span id="reciboTelefono">-</span></p>
                <p><strong>Evento:</strong> <span id="reciboEvento">-</span></p>
            </div>
            <div class="info-column" style="text-align: right;">
                <p><strong>Nº Recibo:</strong> <span id="reciboNumero">-</span></p>
                <p><strong>Fecha Emisión:</strong> <span id="reciboFechaPago">-</span></p>
                <p><strong>Fecha Evento:</strong> <span id="reciboFechaEvento">-</span></p>
            </div>
        </div>

        <table class="detalles-tabla">
            <thead>
                <tr>
                    <th>Concepto</th>
                    <th style="text-align: right;">Medio de Pago</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="reciboConcepto">-</td>
                    <td id="reciboFormaPago" style="text-align: right;">-</td>
                </tr>
            </tbody>
        </table>

        <div class="totales-box">
            <div class="totales-row">
                <span>Presupuesto Total:</span>
                <span id="reciboTotal">$0</span>
            </div>
            <div class="totales-row">
                <span>Monto Abonado:</span>
                <span id="reciboImporte" style="font-weight: bold;">$0</span>
            </div>
            <div class="totales-row total-final">
                <span>Saldo Pendiente:</span>
                <span id="reciboSaldo">$0</span>
            </div>
        </div>

        <div id="observacionesContainer" class="observaciones-box" style="display: none;">
            <strong>Observaciones:</strong> <span id="reciboObservaciones"></span>
        </div>

        <div class="footer-contacto">
            <div id="reciboContactoInfo"></div>
            <div id="reciboRedesInfo"></div>
        </div>

        <div class="acciones">
            <button class="btn" onclick="window.print()">🖨️ Imprimir / Guardar en PDF</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./admin/supabase.js";

        async function cargarDatosRecibo() {
            const params = new URLSearchParams(window.location.search);
            const idRecibo = params.get("id");

            if (!idRecibo) {
                alert("No se especificó ningún número o ID de recibo.");
                return;
            }

            // 1. Cargar el recibo desde Supabase
            const { data: recibo, error: errorRecibo } = await supabase
                .from("recibos")
                .select("*")
                .eq("id", idRecibo)
                .single();

            if (errorRecibo || !recibo) {
                alert("No se encontró el comprobante solicitado.");
                return;
            }

            // 2. Cargar los datos de configuración del DJ / Marca usando user_id
            const { data: config } = await supabase
                .from("configuracion")
                .select("*")
                .eq("user_id", recibo.user_id)
                .maybeSingle();

            // Rellenar Marca y Contacto
            if (config) {
                // Logo
                if (config.logo) {
                    document.getElementById("contenedorLogo").innerHTML = `<img src="${config.logo}" class="logo-img" alt="Logo">`;
                }

                // Nombre comercial
                const nombreMarca = config.nombre_fantasia || config.nombre_negocio || config.nombre || "Leitmix Producciones";
                document.getElementById("reciboNombreNegocio").innerText = nombreMarca;
                document.getElementById("reciboSubtitulo").innerText = config.subtitulo || "Servicios Integrales para Eventos";

                // Contacto (WhatsApp & Alias)
                const whatsapp = config.telefono_whatsapp || config.whatsapp || "";
                const alias = config.alias_pago || "";
                
                let contactoHtml = "";
                if (whatsapp) contactoHtml += `📲 <strong>WhatsApp:</strong> ${whatsapp} `;
                if (alias) contactoHtml += `${contactoHtml ? '| ' : ''}💳 <strong>Alias Mercado Pago:</strong> ${alias}`;
                
                document.getElementById("reciboContactoInfo").innerHTML = contactoHtml;

                // Redes Sociales
                const instagram = config.instagram_url || config.instagram || "";
                const tiktok = config.tiktok_url || "";
                const youtube = config.youtube_url || "";

                let redesHtml = [];
                if (instagram) redesHtml.push(`📷 <strong>Instagram:</strong> ${instagram.replace('https://', '').replace('http://', '')}`);
                if (tiktok) redesHtml.push(`🎵 <strong>TikTok:</strong> ${tiktok.replace('https://', '').replace('http://', '')}`);
                if (youtube) redesHtml.push(`▶️ <strong>YouTube:</strong> ${youtube.replace('https://', '').replace('http://', '')}`);

                document.getElementById("reciboRedesInfo").innerHTML = redesHtml.join(" &nbsp;|&nbsp; ");
            } else {
                document.getElementById("reciboNombreNegocio").innerText = "Leitmix Producciones";
            }

            // Rellenar datos del cliente y montos del recibo
            document.getElementById("reciboCliente").innerText = recibo.nombre || "-";
            document.getElementById("reciboTelefono").innerText = recibo.telefono || "-";
            document.getElementById("reciboEvento").innerText = recibo.evento || "-";
            document.getElementById("reciboNumero").innerText = recibo.numero_recibo || `#${recibo.id}`;

            const fechaEmision = recibo.fecha_pago ? new Date(recibo.fecha_pago).toLocaleDateString("es-AR") : new Date().toLocaleDateString("es-AR");
            document.getElementById("reciboFechaPago").innerText = fechaEmision;
            document.getElementById("reciboFechaEvento").innerText = recibo.fecha_evento || "-";

            document.getElementById("reciboConcepto").innerText = recibo.concepto || "Seña / Servicio de Dj & Ambientación";
            document.getElementById("reciboFormaPago").innerText = recibo.forma_pago || "Transferencia / Efectivo";

            document.getElementById("reciboTotal").innerText = "$" + Number(recibo.total || 0).toLocaleString("es-AR");
            document.getElementById("reciboImporte").innerText = "$" + Number(recibo.importe || 0).toLocaleString("es-AR");
            document.getElementById("reciboSaldo").innerText = "$" + Number(recibo.saldo_pendiente || 0).toLocaleString("es-AR");

            if (recibo.observaciones && recibo.observaciones.trim() !== "") {
                document.getElementById("reciboObservaciones").innerText = recibo.observaciones;
                document.getElementById("observacionesContainer").style.display = "block";
            }
        }

        cargarDatosRecibo();
    </script>
</body>
</html>
