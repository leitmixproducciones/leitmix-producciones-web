<!DOCTYPE html>  
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Pago</title>
    <!-- Librería para generar y descargar PDFs directamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .recibo-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            width: 100%;
            max-width: 650px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* MARCA DE AGUA CENTRADA Y NÍTIDA */
        .marca-de-agua {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 420px;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            object-fit: contain;
        }

        /* Capas por encima de la marca de agua */
        .header, .info-section, .detalles-tabla, .totales-box, 
        .observaciones-box, .gracias-mensaje, .footer-contacto, .acciones {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #f5b400;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        /* LOGO PRINCIPAL EN ENCABEZADO */
        .logo-img {
            max-height: 110px;
            max-width: 300px;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .header h1 {
            color: #f5b400;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .header p {
            color: #aaa;
            font-size: 13px;
            margin-top: 2px;
        }
        .info-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 13px;
            background: rgba(34, 34, 34, 0.85);
            padding: 12px;
            border-radius: 6px;
            gap: 10px;
            border: 1px solid #2a2a2a;
        }
        .info-column {
            flex: 1;
        }
        .info-column p {
            margin: 4px 0;
            line-height: 1.3;
        }
        .detalles-tabla {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
        }
        .detalles-tabla th, .detalles-tabla td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .detalles-tabla th {
            color: #f5b400;
            background: rgba(34, 34, 34, 0.85);
        }
        .totales-box {
            background: rgba(34, 34, 34, 0.85);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            border: 1px solid #2a2a2a;
        }
        .totales-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .totales-row.total-final {
            font-size: 15px;
            font-weight: bold;
            color: #f5b400;
            border-top: 1px solid #444;
            padding-top: 6px;
            margin-top: 6px;
        }
        .observaciones-box {
            background: rgba(22, 22, 22, 0.85);
            border-left: 3px solid #f5b400;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 14px;
            font-size: 12px;
            color: #ccc;
        }
        
        .gracias-mensaje {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #f5b400;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .footer-contacto {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #333;
            padding-top: 12px;
            line-height: 1.5;
        }
        .footer-contacto strong {
            color: #f5b400;
        }
        
        .redes-lista {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .acciones {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            background: #f5b400;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: #d49a00;
        }
        .btn-secundario {
            background: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-secundario:hover {
            background: #444;
        }

        /* REGLAS STRICTAS IMPRESIÓN / SALIDA PDF A4 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            .recibo-container {
                background: #fff !important;
                border: 1px solid #bbb !important;
                box-shadow: none !important;
                color: #000 !important;
                max-width: 100% !important;
                padding: 16px !important;
                page-break-inside: avoid !important;
            }
            .marca-de-agua {
                opacity: 0.14 !important;
                filter: none !important;
            }
            .info-section, .totales-box, .observaciones-box {
                background: rgba(248, 249, 250, 0.9) !important;
                border: 1px solid #ddd !important;
                color: #000 !important;
            }
            .detalles-tabla th {
                color: #000 !important;
                background: rgba(238, 238, 238, 0.9) !important;
                border-bottom: 2px solid #000 !important;
            }
            .detalles-tabla td {
                border-bottom: 1px solid #ddd !important;
            }
            .totales-row.total-final {
                color: #000 !important;
                border-top: 1px solid #000 !important;
            }
            .header {
                border-bottom: 2px solid #000 !important;
            }
            .header h1 {
                color: #000 !important;
            }
            .gracias-mensaje {
                color: #000 !important;
            }
            .footer-contacto {
                border-top: 1px solid #000 !important;
                color: #222 !important;
            }
            .footer-contacto strong {
                color: #000 !important;
            }
            .acciones {
                display: none !important;
            }
        }

        /* ESTILO TEMPORAL PARA CAPTURA PDF */
        .modo-pdf {
            background: #ffffff !important;
            color: #000000 !important;
            border: 1px solid #ccc !important;
            box-shadow: none !important;
        }
        .modo-pdf .marca-de-agua {
            opacity: 0.15 !important;
            filter: none !important;
        }
        .modo-pdf .info-section, 
        .modo-pdf .totales-box, 
        .modo-pdf .observaciones-box {
            background: rgba(249, 249, 249, 0.88) !important;
            border: 1px solid #ddd !important;
            color: #000 !important;
        }
        .modo-pdf .detalles-tabla th {
            background: rgba(238, 238, 238, 0.88) !important;
            color: #000 !important;
            border-bottom: 2px solid #000 !important;
        }
        .modo-pdf .detalles-tabla td {
            color: #000 !important;
            border-bottom: 1px solid #ddd !important;
        }
        .modo-pdf .header h1,
        .modo-pdf .totales-row.total-final,
        .modo-pdf .gracias-mensaje,
        .modo-pdf .footer-contacto strong {
            color: #000 !important;
        }
        .modo-pdf .header {
            border-bottom: 2px solid #000 !important;
        }
        .modo-pdf .footer-contacto {
            border-top: 1px solid #000 !important;
            color: #333 !important;
        }
    </style>
</head>
<body>
    <div class="recibo-container" id="reciboArea">
        <!-- MARCA DE AGUA FLOTANTE -->
        <div id="contenedorMarcaAgua"></div>

        <div class="header">
            <div id="contenedorLogo"></div>
            <h1 id="reciboNombreNegocio">Cargando comprobante...</h1>
            <p id="reciboSubtitulo"></p>
        </div>

        <div class="info-section">
            <div class="info-column">
                <p><strong>Cliente:</strong> <span id="reciboCliente">-</span></p>
                <p><strong>Teléfono:</strong> <span id="reciboTelefono">-</span></p>
                <p><strong>Evento:</strong> <span id="reciboEvento">-</span></p>
            </div>
            <div class="info-column" style="text-align: right;">
                <p><strong>Nº Recibo:</strong> <span id="reciboNumero">-</span></p>
                <p><strong>Fecha Emisión:</strong> <span id="reciboFechaPago">-</span></p>
                <p><strong>Fecha Evento:</strong> <span id="reciboFechaEvento">-</span></p>
            </div>
        </div>

        <table class="detalles-tabla">
            <thead>
                <tr>
                    <th>Concepto</th>
                    <th style="text-align: right;">Medio de Pago</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="reciboConcepto">-</td>
                    <td id="reciboFormaPago" style="text-align: right;">-</td>
                </tr>
            </tbody>
        </table>

        <div class="totales-box">
            <div class="totales-row">
                <span>Presupuesto Total:</span>
                <span id="reciboTotal">$0</span>
            </div>
            <div class="totales-row">
                <span>Monto Abonado:</span>
                <span id="reciboImporte" style="font-weight: bold;">$0</span>
            </div>
            <div class="totales-row total-final">
                <span>Saldo Pendiente:</span>
                <span id="reciboSaldo">$0</span>
            </div>
        </div>

        <div id="observacionesContainer" class="observaciones-box" style="display: none;">
            <strong>Observaciones:</strong> <span id="reciboObservaciones"></span>
        </div>

        <div class="gracias-mensaje">
            ✨ ¡Muchas gracias por confiar en nosotros! ✨
        </div>

        <div class="footer-contacto">
            <div id="reciboContactoInfo"></div>
            <div id="reciboRedesInfo" class="redes-lista"></div>
        </div>

        <div class="acciones" id="bloqueAcciones">
            <button class="btn" id="btnDescargarPDF">📥 Descargar PDF</button>
            <button class="btn btn-secundario" onclick="window.print()">🖨️ Imprimir</button>
        </div>
    </div>

    <script type="module">
        async function obtenerSupabase() {
            // Intenta importar supabase.js desde múltiples ubicaciones probables
            const posiblesRutas = [
                "./supabase.js",
                "./admin/supabase.js",
                "../supabase.js",
                "/leitmix-producciones-web/supabase.js",
                "/leitmix-producciones-web/admin/supabase.js"
            ];

            for (const ruta of posiblesRutas) {
                try {
                    const mod = await import(ruta);
                    if (mod && mod.supabase) return mod.supabase;
                } catch (e) {
                    // Continúa intentando con la siguiente ruta si falla
                }
            }
            return null;
        }

        async function cargarDatosRecibo() {
            const supabase = await obtenerSupabase();
            
            if (!supabase) {
                document.getElementById("reciboNombreNegocio").innerText = "Error al conectar con la Base de Datos";
                alert("No se encontró el archivo de conexión a Supabase (supabase.js).");
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const idRecibo = params.get("id");

            if (!idRecibo) {
                document.getElementById("reciboNombreNegocio").innerText = "Comprobante no especificado";
                alert("No se especificó ningún ID de recibo en la dirección web (?id=...)");
                return;
            }

            // 1. Cargar el recibo desde Supabase
            const { data: recibo, error: errorRecibo } = await supabase
                .from("recibos")
                .select("*")
                .eq("id", idRecibo)
                .single();

            if (errorRecibo || !recibo) {
                document.getElementById("reciboNombreNegocio").innerText = "Comprobante no encontrado";
                alert("No se encontró el comprobante en la base de datos.");
                return;
            }

            // 2. Cargar los datos de configuración del DJ / Marca usando user_id
            if (recibo.user_id) {
                const { data: config } = await supabase
                    .from("configuracion")
                    .select("*")
                    .eq("user_id", recibo.user_id)
                    .maybeSingle();

                if (config) {
                    // Logo principal y Marca de Agua
                    if (config.logo) {
                        document.getElementById("contenedorLogo").innerHTML = `<img src="${config.logo}" class="logo-img" alt="Logo">`;
                        document.getElementById("contenedorMarcaAgua").innerHTML = `<img src="${config.logo}" class="marca-de-agua" alt="Marca de agua">`;
                    }

                    // Nombre comercial
                    const nombreMarca = config.nombre_fantasia || config.nombre_negocio || config.nombre || "Leitmix Producciones";
                    document.getElementById("reciboNombreNegocio").innerText = nombreMarca;
                    document.getElementById("reciboSubtitulo").innerText = config.subtitulo || "Servicios Integrales para Eventos";

                    // Contacto (WhatsApp & Alias)
                    const whatsapp = config.telefono_whatsapp || config.whatsapp || "";
                    const alias = config.alias_pago || "";
                    
                    let contactoHtml = "";
                    if (whatsapp) contactoHtml += `📲 <strong>WhatsApp:</strong> ${whatsapp} `;
                    if (alias) contactoHtml += `${contactoHtml ? '| ' : ''}💳 <strong>Alias:</strong> ${alias}`;
                    
                    document.getElementById("reciboContactoInfo").innerHTML = contactoHtml;

                    // Redes Sociales
                    const instagram = config.instagram_url || config.instagram || "";
                    const tiktok = config.tiktok_url || "";
                    const youtube = config.youtube_url || "";

                    let redesHtml = "";
                    if (instagram) redesHtml += `<div>📷 <strong>Instagram:</strong> ${instagram.replace('https://', '').replace('http://', '')}</div>`;
                    if (tiktok) redesHtml += `<div>🎵 <strong>TikTok:</strong> ${tiktok.replace('https://', '').replace('http://', '')}</div>`;
                    if (youtube) redesHtml += `<div>▶️ <strong>YouTube:</strong> ${youtube.replace('https://', '').replace('http://', '')}</div>`;

                    document.getElementById("reciboRedesInfo").innerHTML = redesHtml;
                } else {
                    document.getElementById("reciboNombreNegocio").innerText = "Leitmix Producciones";
                }
            } else {
                document.getElementById("reciboNombreNegocio").innerText = "Leitmix Producciones";
            }

            // 3. Rellenar datos del cliente y montos del recibo
            document.getElementById("reciboCliente").innerText = recibo.nombre || "-";
            document.getElementById("reciboTelefono").innerText = recibo.telefono || "-";
            document.getElementById("reciboEvento").innerText = recibo.evento || "-";
            const numReciboLimpio = recibo.numero_recibo || `#${recibo.id}`;
            document.getElementById("reciboNumero").innerText = numReciboLimpio;

            const fechaEmision = recibo.fecha_pago ? new Date(recibo.fecha_pago).toLocaleDateString("es-AR") : new Date().toLocaleDateString("es-AR");
            document.getElementById("reciboFechaPago").innerText = fechaEmision;
            document.getElementById("reciboFechaEvento").innerText = recibo.fecha_evento || "-";

            document.getElementById("reciboConcepto").innerText = recibo.concepto || "Seña / Servicio de Dj & Ambientación";
            document.getElementById("reciboFormaPago").innerText = recibo.forma_pago || "Transferencia / Efectivo";

            document.getElementById("reciboTotal").innerText = "$" + Number(recibo.total || 0).toLocaleString("es-AR");
            document.getElementById("reciboImporte").innerText = "$" + Number(recibo.importe || 0).toLocaleString("es-AR");
            document.getElementById("reciboSaldo").innerText = "$" + Number(recibo.saldo_pendiente || 0).toLocaleString("es-AR");

            if (recibo.observaciones && recibo.observaciones.trim() !== "") {
                document.getElementById("reciboObservaciones").innerText = recibo.observaciones;
                document.getElementById("observacionesContainer").style.display = "block";
            }

            // Configurar acción de descarga directa del PDF
            document.getElementById("btnDescargarPDF").addEventListener("click", () => {
                const elemento = document.getElementById("reciboArea");
                const bloqueAcciones = document.getElementById("bloqueAcciones");

                // Ocultar botones y aplicar estilo claro para el archivo PDF final
                bloqueAcciones.style.display = "none";
                elemento.classList.add("modo-pdf");

                const opciones = {
                    margin:       10,
                    filename:     `Recibo_${numReciboLimpio.replace('#', '')}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opciones).from(elemento).save().then(() => {
                    // Restaurar visualización en pantalla
                    bloqueAcciones.style.display = "flex";
                    elemento.classList.remove("modo-pdf");
                });
            });
        }

        cargarDatosRecibo();
    </script>
</body>
</html>
